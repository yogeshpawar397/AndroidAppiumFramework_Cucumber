# Android / Appium configuration
environment=local
platformName=Android
automationName=UiAutomator2
deviceName=V2502
# Leave blank when only one Android device is connected.
udid=
appiumServerUrl=http://127.0.0.1:4723
noReset=false
autoLaunch=false
driverInitRetries=2

# Keep these blank for a framework smoke test that attaches to the current device state.
# For a real application, provide appPackage/appActivity or app path.
app=
appPackage=
appActivity=

# Timeouts (seconds)
implicitWait=0
explicitWait=15

# Cucumber
cucumber.featurePath=src/test/resources/features
